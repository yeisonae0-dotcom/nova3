<style>

:root[data-theme="dark"]{--bg:#090a12;--card:rgba(28,30,50,.8);--solid:#1a1c30;--text:#f0f1ff;--muted:#9296b8;--line:rgba(255,255,255,.09);--sh:0 6px 24px rgba(0,0,0,.45);--g1:rgba(90,100,255,.3);--g2:rgba(200,80,200,.2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{color:var(--text);background:radial-gradient(70% 40% at 15% 0%,var(--g1),transparent 70%),radial-gradient(60% 40% at 100% 10%,var(--g2),transparent 70%),var(--bg);
font:16px/1.45 ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.app{height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column}

@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 6px}
.top h2{margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:17px;cursor:pointer;margin-left:8px;box-shadow:var(--sh);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.ib:active{transform:scale(.9)}
#chat{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px;display:flex;flex-direction:column;gap:10px}
.hero{margin:auto 0}

.me{align-self:flex-end;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));border-bottom-right-radius:7px;box-shadow:0 8px 20px rgba(100,80,240,.35)}

.tool{align-self:flex-start;font-size:12.5px;font-weight:600;color:var(--a1);padding:5px 12px;border-radius:99px;background:rgba(91,91,240,.12);animation:pop .25s}
.dots{display:inline-flex;gap:4px;padding:5px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--a2);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-5px);opacity:1}}
#timers{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px}
#timers:not(:empty){padding-top:6px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;padding:7px 13px;border-radius:99px;color:#fff;background:linear-gradient(135deg,#ff8a5b,#ff4f8b);box-shadow:0 6px 16px rgba(255,80,130,.35);animation:pop .3s}
.timer.done{background:linear-gradient(135deg,#2fd08a,#14b8a6)}
.composer{display:flex;align-items:flex-end;gap:6px;margin:8px 12px 10px;padding:7px 7px 7px 18px;border-radius:30px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:box-shadow .2s}
.composer:focus-within{box-shadow:0 0 0 2px rgba(110,100,250,.5),var(--sh)}
textarea{flex:1;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:16px;resize:none;max-height:110px;padding:9px 0;line-height:1.35}
textarea::placeholder{color:var(--muted)}
.rb{flex:none;width:42px;height:42px;border:0;border-radius:50%;font-size:19px;cursor:pointer;color:var(--text);background:transparent}
.rb.rec{color:#fff;background:#ff4f6d;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,79,109,.2)}}
#send{color:#fff;font-weight:700;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 6px 16px rgba(120,90,250,.5)}
#send:disabled{opacity:.4}
.sec{flex:1;overflow-y:auto;padding:6px 16px 16px;display:flex;flex-direction:column;gap:10px}
.add{display:flex;gap:8px;padding:0 16px 8px}
.add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:16px;padding:13px 16px;border-radius:18px;outline:0;box-shadow:var(--sh)}
.add input:focus{border-color:var(--a1)}
.add button{border:0;border-radius:18px;padding:0 20px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));cursor:pointer}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);animation:pop .3s}
.item span{flex:1;word-break:break-word}
.item.done span{text-decoration:line-through;color:var(--muted)}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--a1);background:transparent;color:#fff;font-size:14px;cursor:pointer;display:grid;place-items:center}
.done .chk{background:var(--a1)}
.del{border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px}
.empty{margin:auto;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:4px;margin:0 14px 8px;padding:6px;border-radius:28px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6)}
.tabs button{flex:1;position:relative;border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:600;padding:8px 0 6px;border-radius:22px;cursor:pointer;transition:all .2s}
.tabs button i{display:block;font-style:normal;font-size:21px;line-height:1.2}
.tabs button.on{color:var(--a1);background:rgba(91,91,240,.12)}
.tabs em{position:absolute;top:3px;left:55%;min-width:18px;height:18px;border-radius:9px;background:#ff4f6d;color:#fff;font-style:normal;font-size:11px;line-height:18px;padding:0 5px}
.island{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:9px;height:36px;padding:0 18px;border-radius:99px;border:0;background:#000;color:#fff;font:inherit;font-size:13.5px;font-weight:700;white-space:nowrap;max-width:90vw;cursor:pointer;font-variant-numeric:tabular-nums;box-shadow:0 10px 28px rgba(0,0,0,.4),0 0 0 1.5px rgba(160,92,246,.6),0 0 26px rgba(120,100,255,.45);transition:transform .25s cubic-bezier(.2,.9,.3,1.2)}
.island::before{content:"";width:10px;height:10px;border-radius:50%;background:conic-gradient(#5b5bf0,#ff5cae,#ffb347,#5bd0ff,#5b5bf0);animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.island:active{transform:translateX(-50%) scale(.92)}
main{margin-top:48px}
.top h2{font-size:28px}
body::before{content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(40% 30% at 20% 22%,var(--g1),transparent),radial-gradient(38% 30% at 82% 72%,var(--g2),transparent);animation:drift 16s ease-in-out infinite alternate}

.app{position:relative;z-index:1}
.hero h1{font-size:37px}
.card{background:linear-gradient(160deg,rgba(255,255,255,.14),transparent 60%),var(--card);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.5)}
.tabs button.on{background:linear-gradient(135deg,rgba(91,91,240,.18),rgba(160,92,246,.16))}
.menu{position:fixed;z-index:70;top:calc(env(safe-area-inset-top,0px) + 6px);left:14px;width:40px;height:36px;border-radius:99px;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:0}

body.dr .menu span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

.drawer{position:fixed;top:0;bottom:0;left:0;z-index:60;width:min(84vw,330px);display:flex;flex-direction:column;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 60px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);background:var(--solid);border-right:1px solid var(--line);border-radius:0 30px 30px 0;box-shadow:12px 0 50px rgba(0,0,0,.28);transform:translateX(-106%);transition:transform .38s cubic-bezier(.2,.85,.2,1)}

.rt{flex:1;min-width:0;text-align:left;border:0;background:transparent;color:var(--text);font:inherit;padding:11px 12px;cursor:pointer}

.rt small{color:var(--muted);font-size:12.5px}

svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
:root{--lgbg:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.18) 48%,rgba(255,255,255,.42));--lgbd:rgba(255,255,255,.7);--lghi:rgba(255,255,255,.95);--lgsh:0 10px 30px rgba(40,50,120,.16);--tabon:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,255,255,.35));--drbase:rgba(246,247,255,.5)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lgbg:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.04) 48%,rgba(255,255,255,.1));--lgbd:rgba(255,255,255,.2);--lghi:rgba(255,255,255,.42);--lgsh:0 12px 34px rgba(0,0,0,.5);--tabon:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.07));--drbase:rgba(12,14,30,.55)}}
:root[data-theme="dark"]{--lgbg:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.04) 48%,rgba(255,255,255,.1));--lgbd:rgba(255,255,255,.2);--lghi:rgba(255,255,255,.42);--lgsh:0 12px 34px rgba(0,0,0,.5);--tabon:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.07));--drbase:rgba(12,14,30,.55)}
body::after{content:"";position:fixed;z-index:0;width:60vmax;height:60vmax;right:-30vmax;bottom:-22vmax;border-radius:50%;background:radial-gradient(circle,rgba(255,120,200,.4),transparent 65%);filter:blur(30px);animation:drift 20s ease-in-out infinite alternate-reverse;pointer-events:none}
.menu,.ib,.card,.composer,.tabs,.bot,.item,.add input,.tool{background:var(--lgbg);border:1px solid var(--lgbd);-webkit-backdrop-filter:blur(24px) saturate(1.9);backdrop-filter:blur(24px) saturate(1.9);box-shadow:inset 0 1.5px 0 var(--lghi),inset 0 -1px 0 rgba(255,255,255,.2),inset 1px 0 0 rgba(255,255,255,.3),var(--lgsh)}

.auth{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 20px);background:radial-gradient(70% 45% at 15% 0%,var(--g1),transparent 70%),radial-gradient(60% 45% at 100% 90%,var(--g2),transparent 70%),var(--bg)}

.lights i{filter:none;opacity:1;animation:none;left:auto;right:auto;top:auto;bottom:auto;border-radius:50%;box-shadow:inset -8px -10px 22px rgba(0,0,0,.18),inset 8px 8px 18px rgba(255,255,255,.55),0 0 46px var(--bc)}
.lights i:nth-child(1){--bc:rgba(255,79,163,.7);width:118px;height:118px;left:9%;top:27%;background:radial-gradient(circle at 32% 28%,#ffd6ec,#ff4fa3 55%,#c2185b);animation:ballA 7s ease-in-out infinite alternate}
.lights i:nth-child(2){--bc:rgba(79,139,255,.7);width:86px;height:86px;right:11%;top:38%;background:radial-gradient(circle at 32% 28%,#dbe8ff,#4f8bff 55%,#1d4ed8);animation:ballB 6s ease-in-out infinite alternate}
.lights i:nth-child(3){--bc:rgba(47,227,176,.7);width:140px;height:140px;left:35%;bottom:25%;background:radial-gradient(circle at 32% 28%,#ccfff1,#2fe3b0 55%,#0f9d7a);animation:ballC 8s ease-in-out infinite alternate}
.lights i:nth-child(n+4){display:none}
@keyframes ballA{0%{transform:translate(0,0) scale(1)}50%{transform:translate(42px,-56px) scale(1.08)}100%{transform:translate(-20px,38px) scale(.94)}}
@keyframes ballB{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-46px,50px) scale(1.12)}100%{transform:translate(24px,-34px) scale(.92)}}
@keyframes ballC{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,-44px) scale(.92)}100%{transform:translate(50px,26px) scale(1.1)}}
/* perfil del banner, más arriba (casi junto a las 3 líneas) */

/* ---- v10: bolas gelatina, soporte, memoria ---- */
[hidden]{display:none!important}
.lights i{display:none!important}
.lights canvas{position:absolute;left:0;top:0;width:100%;height:100%;opacity:.88}
.shc{overflow-y:auto;-webkit-overflow-scrolling:touch}
.memv{max-height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.memt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--lgbg);border:1px solid var(--lgbd);font-weight:600;cursor:pointer}
.memt span{flex:1}
.memt input{position:absolute;opacity:0;pointer-events:none}
.memt i{position:relative;flex:none;width:48px;height:28px;border-radius:99px;background:rgba(120,120,160,.35);transition:background .3s}
.memt i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .35s var(--bounce)}

.mems{padding:2px 4px}

.mems ul{margin:0;padding-left:18px}.mems li{margin:3px 0}
/* soporte */
.sup{position:fixed;inset:0;z-index:125;display:none}
.sup.on{display:block}
.supbg{position:absolute;inset:0;background:rgba(8,10,28,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .25s}
.sup.out .supbg{opacity:0;transition:opacity .26s}
.supc{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:480px;margin:0 auto;padding:22px 18px 18px;border-radius:32px;background:var(--lgbg),var(--drbase);-webkit-backdrop-filter:blur(30px) saturate(1.9);backdrop-filter:blur(30px) saturate(1.9);border:1px solid var(--lgbd);box-shadow:inset 0 1.5px 0 var(--lghi),0 22px 64px rgba(0,0,0,.38);max-height:90vh;overflow-y:auto;animation:sheetUp .6s var(--bounce)}
.sup.out .supc{animation:sheetDown .27s cubic-bezier(.4,0,1,1) forwards}

.supc p{margin:0 0 10px;color:var(--muted)}
.spl{display:block;margin:12px 4px 6px;font-size:12.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.supc select,.supc textarea{width:100%;border:1px solid var(--lgbd);background:var(--lgbg);color:var(--text);font:inherit;font-size:16px;padding:13px 15px;border-radius:18px;outline:0;box-shadow:inset 0 1.5px 0 var(--lghi)}
.supc select option{color:#111}
.supc textarea{resize:none;min-height:120px;line-height:1.4}
.supc select:focus,.supc textarea:focus{border-color:var(--a1);box-shadow:0 0 0 3px rgba(91,91,240,.22)}
#sp-err{min-height:20px;margin-top:8px;color:#ff4f6d;font-weight:600;font-size:14px;text-align:center}
.sprow{display:flex;gap:10px;margin-top:6px}
.sprow button{flex:1;padding:15px;border-radius:18px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;transition:transform .3s var(--bounce)}
.sprow button:active{transform:scale(.95)}
#sp-close,#sp-ok2{border:1px solid var(--lgbd);background:var(--lgbg);color:var(--text)}
#sp-send,#sp-ok2.pri{border:0;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),0 8px 20px rgba(110,90,250,.42)}
#sp-load{text-align:center;padding:10px 4px 2px}
.spring{display:grid;place-items:center;height:76px;margin-bottom:8px}
.spin.big{width:46px;height:46px;border-width:5px;border-color:rgba(130,130,180,.3);border-top-color:var(--a1)}
.okc{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;color:#fff;background:linear-gradient(135deg,#2fd08a,#14b8a6);box-shadow:0 10px 26px rgba(47,208,138,.45);animation:avpop .6s cubic-bezier(.2,1.8,.4,1)}
.okc.warn{background:linear-gradient(135deg,#ffb347,#ff7a45);box-shadow:0 10px 26px rgba(255,122,69,.4)}
.okc svg{width:30px;height:30px;stroke-width:3}
.spbar{height:8px;border-radius:6px;background:rgba(130,130,180,.25);overflow:hidden;margin:14px 6px 12px}
.spbar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--a1),#2fd08a)}
#sp-after{margin-top:10px}
.amenu.on .ai:nth-child(6){animation-delay:.3s}
/* ---- v11: glass menos transparente, bolas tranquilas, timer ---- */
:root{--lgbg:linear-gradient(135deg,rgba(255,255,255,.88),rgba(255,255,255,.66) 48%,rgba(255,255,255,.8)),linear-gradient(rgba(244,246,255,.6),rgba(244,246,255,.6));--drbase:rgba(246,247,255,.86);--card:rgba(255,255,255,.94)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lgbg:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.05) 48%,rgba(255,255,255,.1)),linear-gradient(rgba(14,16,34,.84),rgba(14,16,34,.84));--drbase:rgba(12,14,30,.88);--card:rgba(28,30,50,.94)}}
:root[data-theme="dark"]{--lgbg:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.05) 48%,rgba(255,255,255,.1)),linear-gradient(rgba(14,16,34,.84),rgba(14,16,34,.84));--drbase:rgba(12,14,30,.88);--card:rgba(28,30,50,.94)}
/* 3 bolas paseando tranquilas */
.lights canvas{display:none}
.lights i{display:block!important;opacity:.8!important}
.lights i:nth-child(1){--bc:rgba(255,79,163,.4)!important;width:112px!important;height:112px!important;left:6%!important;top:20%!important;animation:wanderA 38s ease-in-out infinite!important}
.lights i:nth-child(2){--bc:rgba(79,139,255,.4)!important;width:82px!important;height:82px!important;right:6%!important;left:auto!important;top:46%!important;animation:wanderB 46s ease-in-out infinite!important}
.lights i:nth-child(3){--bc:rgba(47,227,176,.4)!important;width:132px!important;height:132px!important;left:34%!important;bottom:18%!important;top:auto!important;animation:wanderC 54s ease-in-out infinite!important}
@keyframes wanderA{0%,100%{transform:translate(0,0)}25%{transform:translate(52vw,10vh)}50%{transform:translate(68vw,46vh)}75%{transform:translate(18vw,58vh)}}
@keyframes wanderB{0%,100%{transform:translate(0,0)}25%{transform:translate(-50vw,-18vh)}50%{transform:translate(-66vw,22vh)}75%{transform:translate(-22vw,38vh)}}
@keyframes wanderC{0%,100%{transform:translate(0,0)}25%{transform:translate(-30vw,-36vh)}50%{transform:translate(34vw,-52vh)}75%{transform:translate(46vw,-14vh)}}
/* panel del timer */
.tp{position:fixed;inset:0;z-index:108;display:none}
.tp.on{display:block}
.tpbg{position:absolute;inset:0;background:rgba(6,8,22,.55);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);animation:fade .3s}
.tp.out .tpbg{opacity:0;transition:opacity .4s}
.tpc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 64px) 22px calc(env(safe-area-inset-bottom,0px) + 30px);color:#fff;text-align:center;background:radial-gradient(80% 50% at 50% 24%,rgba(120,100,255,.38),transparent 70%),linear-gradient(170deg,#12163a,#241442 60%,#10132f);transform-origin:46px 70px;animation:tpIn .6s var(--spring)}
.tp.out .tpc{animation:tpOut .43s cubic-bezier(.5,0,.75,.35) forwards}
.tp.ring .tpc{background:radial-gradient(80% 50% at 50% 24%,rgba(255,80,110,.5),transparent 70%),linear-gradient(170deg,#2a0f22,#3a1030 60%,#1c0b1e);animation:tpIn .6s var(--spring),ringbg 1s ease-in-out .6s infinite alternate}
@keyframes tpIn{from{opacity:0;transform:scale(.1)}}
@keyframes tpOut{to{opacity:0;transform:scale(.06)}}
@keyframes ringbg{to{filter:brightness(1.3)}}
@keyframes ringpulse{50%{transform:scale(1.05)}}
.tpk{font-weight:800;font-size:13px;letter-spacing:.2em;opacity:.8;margin-top:4px}
.tpring{position:relative;width:min(76vw,310px);aspect-ratio:1}
.tpring svg{width:100%;height:100%;transform:rotate(-90deg);stroke-width:10;fill:none}
.tpring .rb{stroke:rgba(255,255,255,.14)}
.tpring .rf{stroke:url(#tpg);stroke-linecap:round;stroke-dasharray:553;stroke-dashoffset:0;transition:stroke-dashoffset .3s linear;filter:drop-shadow(0 0 10px rgba(160,140,255,.7))}
.tp.ring .rf{stroke:#ff5f6d;filter:drop-shadow(0 0 12px rgba(255,80,110,.9))}
.tpt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tpt b{font-size:clamp(38px,12vw,52px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tp.ring .tpt b{animation:ringpulse .7s ease-in-out infinite}
.tpt small{font-size:17px;font-weight:600;opacity:.85;max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpl{width:100%;max-width:360px;max-height:22vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.tpr{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);cursor:pointer}
.tpr .n{flex:1;text-align:left;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpr .t{font-variant-numeric:tabular-nums;font-weight:700;opacity:.9}
.tpr button{border:0;background:transparent;color:#fff;font-size:22px;line-height:1;padding:0 4px;cursor:pointer;opacity:.8}
.tpb{width:100%;max-width:360px}
.tpb button{width:100%;padding:18px;border-radius:22px;border:0;font:inherit;font-weight:800;font-size:18px;letter-spacing:.05em;cursor:pointer;transition:transform .3s var(--bounce)}
.tpb button:active{transform:scale(.95)}
.tpb .min{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.28)}
.tpb .stop{background:linear-gradient(135deg,#ff5f6d,#ff2e63);color:#fff;box-shadow:0 12px 32px rgba(255,46,99,.6),inset 0 1.5px 0 rgba(255,255,255,.5);animation:ringpulse .8s ease-in-out infinite}
/* mini timer debajo de las 3 líneas */
.mini{position:fixed;z-index:69;left:14px;top:calc(env(safe-area-inset-top,0px) + 50px);display:none;align-items:center;gap:7px;height:32px;padding:0 12px 0 9px;border:0;border-radius:99px;color:#fff;font:700 13.5px ui-monospace,Menlo,monospace;background:linear-gradient(135deg,#ff8a5b,#ff4f8b);box-shadow:0 8px 20px rgba(255,80,130,.4),inset 0 1.5px 0 rgba(255,255,255,.45);cursor:pointer}
.mini.on{display:inline-flex;animation:pop2 .45s var(--bounce)}
.mini svg{width:15px;height:15px;stroke-width:2.6}
.mini em{font-style:normal;opacity:.85;font-size:11px}
.mini:active{transform:scale(.92)}
.tabs em.bump{animation:pop2 .5s var(--bounce)}
</style>

estudio, trabajo, ciencia, salud, dinero, programación, creatividad, consejos y más. No te limites a un solo tema. Si algo es peligroso o ilegal, explica con respeto por qué no puedes ayudar con esa parte y ofrece una alternativa segura. En temas de salud, leyes o dinero da información útil y clara y, cuando sea importante, recuerda en una frase que no sustituye a un profesional.\n12) No menciones con qué modelo, empresa o tecnología funcionas a menos que el usuario te lo pregunte directamente (por ejemplo «¿con qué trabajas?» o «¿qué modelo eres?»). Si te lo preguntan, responde con sinceridad: ahora funcionas con {{PROV}}.\nResponde siempre en español.";

/* herramientas */
function calc(expr){
  var e=String(expr).replace(/,/g,'.').replace(/\^/g,'**').replace(/(\d+(?:\.\d+)?)\s*%\s*de\s*(\d+(?:\.\d+)?)/gi,'($1/100*$2)');

}

/* modo local */
function local(q){
  var s0=q.toLowerCase(),md0;
  if(/(cancel|elimin|borr|quit|apag)\w*/.test(s0)&&/(timer|alarma|temporiz|recordatorio)/.test(s0))return delTimers({todos:/todos|todas/.test(s0)});
  if((md0=s0.match(/(elimin|borr|quit)\w*\s+(?:la\s+)?tarea\s*(?:n[uú]mero\s*)?(\d+)/)))return delItem(tasks,'tasks',{numero:+md0[2]},'tarea');
  if(mode==='dev')return 'No hay una IA conectada para generar código ahora. Puedes escribir y ejecutar tu propio código en el Canvas (botón +, Canvas).';
  var s=q.toLowerCase(),m;
  if(/hora|fecha|d[ií]a es/.test(s))return 'Son '+T.hora_actual.execute();
  if((m=s.match(/(\d+)\s*(segundo|seg|minuto|min|hora)/))&&/temporiz|cuenta|timer|alarma|avis|despiert/.test(s))return T.temporizador.execute({segundos:+m[1]*(m[2][0]==='h'?3600:m[2][0]==='m'?60:1),nombre:/alarma/.test(s)?'Alarma':'Timer'});
  if(/tarea/.test(s)&&/mis|ver|mu[eé]str/.test(s))return listTasks();
  if(/tarea|pendiente/.test(s))return T.agregar_tarea.execute({texto:q.replace(/^[^:]*:\s*/,'')});
  if(/mis notas|ver notas/.test(s))return T.ver_notas.execute();
  if(/anota|nota/.test(s))return T.guardar_nota.execute({texto:q.replace(/^[^:]*:\s*|^anota\s*/i,'')});
  try{return '= '+calc(q.replace(/calcula|cu[aá]nto es|:/gi,''))}catch(e){}
  return 'Ahora mismo no tengo conexión con una IA, pero puedo ayudarte con la hora, cálculos, timers y alarmas, tareas y notas.';
}

  var inp=$('sh-i');inp.style.display=c.input?'block':'none';inp.value='';
  if(c.input){inp.placeholder=c.input;inp.type=c.text?'text':'password';inp.setAttribute('inputmode',c.text?'text':'numeric');inp.maxLength=c.text?(c.max||24):6;if(c.value)inp.value=c.value}
  $('sh-e').textContent='';
  var C=$('sh-c');C.innerHTML='';C.style.display=c.build?'block':'none';if(c.build)c.build(C);
  var L=$('sh-l');L.innerHTML='';L.style.display=c.list?'flex':'none';
  if(c.list)c.list.forEach(function(it){var b=document.createElement('button');b.className='lrow'+(it.danger?' danger':'');b.textContent=it.label;b.onclick=function(){sheetClose();it.fn()};L.appendChild(b)});
  var ok=$('sh-ok');ok.style.display=c.ok?'block':'none';ok.textContent=c.ok||'';ok.className=c.danger?'danger':'';
  $('sh-no').textContent=c.list?'Cerrar':'Cancelar';
  shCb=c.cb||null;clearTimeout(shT);$('shx').classList.remove('out');$('shx').classList.add('on');haptic();
  if(c.input)setTimeout(function(){inp.focus()},380);
}
$('sh-no').onclick=sheetClose;$('shbg').onclick=sheetClose;
$('sh-i').addEventListener('keydown',function(e){if(e.key==='Enter')$('sh-ok').click()});
$('sh-ok').onclick=function(){
  var cb=shCb;if(!cb)return;
  Promise.resolve(cb($('sh-i').value.trim())).then(function(res){
    if(res==='next')return;
    if(typeof res==='string'){$('sh-e').textContent=res;haptic()}else sheetClose()});
};
function checkPin(p,pin){return p.hash?hashPin(pin,p.salt).then(function(h){return h===p.hash}):Promise.resolve(true)}
function wipe(p){['tasks','notes','convos'].forEach(function(k){try{localStorage.removeItem(p.pfx+k)}catch(e){}})}
function askDelete(p){
  openSheet({t:'Eliminar perfil',p:'Se borrarán «'+p.name+'» y todas sus tareas, notas y conversaciones. No se puede deshacer.',
    input:null,ok:'Eliminar perfil',danger:true,
    cb:function(v){return Promise.resolve(true).then(function(){
      profiles=raw('profiles','[]').filter(function(x){return x.id!==p.id});rawSet('profiles',profiles);wipe(p);
      if(raw('session','null')===p.id)rawSet('session',null);
      if(me&&me.id===p.id)me=null;
      showAuth()})}});
}
function confirmClear(t,txt,fn){openSheet({t:t,p:txt,ok:'Borrar',danger:true,cb:function(){fn()}})}
function startEdit(){isEdit=true;startComplete(me);$('auth').classList.add('on')}
function newPinSheet(){
  openSheet({t:me.hash?'Nuevo PIN':'Crea un PIN',p:me.hash?'Déjalo vacío para quitar el PIN.':'De 4 a 6 números. Te lo pedirá al abrir la app.',input:'Nuevo PIN',ok:'Guardar',
    cb:function(v){
      if(!v&&!me.hash)return 'Escribe un PIN';
      if(v&&!/^\d{4,6}$/.test(v))return 'Debe tener de 4 a 6 números';
      return (v?hashPin(v,me.salt):Promise.resolve('')).then(function(h){me.hash=h;rawSet('profiles',profiles);rawSet('session',h?null:me.id)})}});
}
function changePin(){
  if(!me.hash)return newPinSheet();
  openSheet({t:'Tu PIN actual',input:'PIN actual',ok:'Continuar',cb:function(v){return checkPin(me,v).then(function(o){if(!o)return 'PIN incorrecto';newPinSheet();return 'next'})}});
}
function wipeConvos(){
  convos=[];cur=null;saveConvos();
  try{localStorage.removeItem(PFX+'convos')}catch(e){}
  chat.innerHTML='';history=[];greet();renderRecents();
}
function resetData(){
  tasks=[];notes=[];save('tasks',tasks);save('notes',notes);
  wipeConvos();renderAll();toast('Todos tus datos se borraron');
}
$('gear').onclick=function(){
  if(!me)return;
  openSheet({t:'Ajustes',list:[
    {label:'Editar perfil',fn:startEdit},
    {label:'Memoria y aprendizaje',fn:memSheet},
    {label:'Búsqueda en internet: '+(gSearchOn()?'activada':'desactivada'),fn:function(){var on=!gSearchOn();try{localStorage.setItem('gsearch',on?'1':'0')}catch(e){}toast(on?'Búsqueda en internet activada':'Búsqueda en internet desactivada')}},
    {label:gkey?'Gemini conectado · cambiar o quitar':'Conectar Gemini (gratis)',fn:geminiSheet},
    {label:me.hash?'Cambiar o quitar PIN':'Poner un PIN',fn:changePin},
    {label:'Borrar conversaciones',fn:function(){confirmClear('Borrar conversaciones','Se borrará todo el historial de Recientes.',function(){wipeConvos();toast('Historial de conversaciones borrado')})}},
    {label:'Borrar tareas hechas',fn:function(){confirmClear('Borrar tareas hechas','Solo se quitarán las tareas ya completadas.',function(){tasks=tasks.filter(function(t){return!t.d});save('tasks',tasks);renderAll();toast('Tareas hechas borradas')})}},
    {label:'Borrar todas las notas',fn:function(){confirmClear('Borrar todas las notas','Se borrarán todas tus notas.',function(){notes=[];save('notes',notes);renderAll();toast('Notas borradas')})}},
    {label:'Borrar todos mis datos',danger:true,fn:function(){confirmClear('Borrar todos mis datos','Tareas, notas y conversaciones. Tu perfil se queda.',resetData)}},
    {label:'Eliminar perfil',danger:true,fn:function(){askDelete(me)}}]});
};

profiles=raw('profiles','[]');
(function(){var ps=raw('profiles','[]'),ch=false;if(!raw('novar_v1','false')){ps.forEach(function(x){if(x.name==='Auron'){x.name='Novar';ch=true}});if(ch)rawSet('profiles',ps);rawSet('novar_v1',true)}})();
profiles=raw('profiles','[]');
var sid=raw('session','null'),found=profiles.filter(function(p){return p.id===sid&&!p.hash&&ready(p)})[0];
if(found)enter(found);else showAuth();
try{if(window.claude&&claude.use)claude.use('sample').then(function(s){sample=s;try{s.limits().then(function(l){imgOK=(l&&l.images)||null}).catch(function(){})}catch(e){}}).catch(function(){})}catch(e){}
})();
</script>
